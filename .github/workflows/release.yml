name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "11", "16", "17", "21", "25"]
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Determine build version
        id: project
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
              echo "Invalid release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            project_version="${BASH_REMATCH[1]}"
          else
            project_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          fi
          if [[ ! "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid project version: $project_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$project_version" >> "$GITHUB_OUTPUT"

      - name: Build plugin
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
        run: mvn --batch-mode --no-transfer-progress -Drevision="${PROJECT_VERSION}" clean package

      - name: Upload JAR artifact
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: ThJumpPads-java8
          path: target/ThJumpPads-${{ steps.project.outputs.version }}.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi
          printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ThJumpPads-java8
          path: release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: gh release create "$TAG_NAME" "release-files/ThJumpPads-${RELEASE_VERSION}.jar" --verify-tag --title "ThJumpPads ${RELEASE_VERSION}" --generate-notes
