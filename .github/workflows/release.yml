name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_release: ${{ steps.resolve.outputs.run_release }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      retag: ${{ steps.resolve.outputs.retag }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
            if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
              echo "ERROR: Tag '$RELEASE_TAG' is not a semantic version tag."
              exit 1
            fi
            echo "run_release=true" >> "$GITHUB_OUTPUT"
            echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "retag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --force --tags origin
          CURRENT_TAG="$(git tag --points-at "$GITHUB_SHA" | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1 || true)"
          if [ -n "$CURRENT_TAG" ]; then
            echo "A release tag already points to this commit; the tag event will publish it."
            echo "run_release=false" >> "$GITHUB_OUTPUT"
            echo "release_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
            echo "retag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! RELEASE_TAG="$(gh api "repos/${GITHUB_REPOSITORY}/tags?per_page=100" --jq '.[0].name // empty')"; then
            echo "::error::Unable to retrieve repository tags to use as the fallback version. No release will be created."
            exit 1
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::The repository has no tags to use as the fallback version. No release will be created."
            exit 1
          fi
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "ERROR: Latest repository tag '$RELEASE_TAG' is not a semantic version tag."
            exit 1
          fi
          echo "No new tag was pushed; the latest repository tag '$RELEASE_TAG' will be recreated at this commit."
          echo "run_release=true" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "retag=true" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate on Java ${{ matrix.java }}
    needs: resolve-release
    if: needs.resolve-release.outputs.run_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "11", "16", "17", "21", "25"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify project
        run: mvn --batch-mode clean verify

  package:
    name: Package Java 8 plugin
    needs: [resolve-release, validate]
    if: needs.resolve-release.outputs.run_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Build release jar
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: mvn --batch-mode "-Drevision=${RELEASE_TAG}" clean package
      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: thjumppads-release-jar
          path: target/ThJumpPads-${{ needs.resolve-release.outputs.release_tag }}.jar
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [resolve-release, package]
    if: needs.resolve-release.outputs.run_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download release jar
        uses: actions/download-artifact@v4
        with:
          name: thjumppads-release-jar
          path: release
      - name: Recreate latest tag when needed
        if: needs.resolve-release.outputs.retag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          TAG_OBJECT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f "tag=${RELEASE_TAG}" \
            -f "message=Release ${RELEASE_TAG}" \
            -f "object=${GITHUB_SHA}" \
            -f "type=commit" \
            --jq .sha)"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${RELEASE_TAG}" \
            -f "sha=${TAG_OBJECT_SHA}"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.release_tag }}
        run: |
          cat > release-notes.md <<EOF
          # ⚠️ Disclaimer!
          This is a github release; we highly recommend you to download the plugin from SpigotMC.

          # How to install (from Github)
          1. Download the jar: \`ThJumpPads-${RELEASE_TAG}.jar\`
          2. Place it in your server's \`plugins\` folder.
          3. Restart your server.
          EOF

          if ! RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id 2>release-lookup-error.txt)"; then
            if grep -q 'HTTP 404' release-lookup-error.txt; then
              RELEASE_ID="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
                -f "tag_name=${RELEASE_TAG}" \
                -f "target_commitish=${GITHUB_SHA}" \
                -f "name=${RELEASE_TAG}" \
                -f "body=$(cat release-notes.md)" \
                -F draft=true \
                --jq .id)"
            else
              cat release-lookup-error.txt
              exit 1
            fi
          else
            OLD_JAR_ASSET_IDS="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              --jq '.assets[] | select(.name | ascii_downcase | endswith(".jar")) | .id')"
          fi

          for ASSET_ID in $OLD_JAR_ASSET_IDS; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}"
          done
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/java-archive" \
            --data-binary "@release/ThJumpPads-${RELEASE_TAG}.jar" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=ThJumpPads-${RELEASE_TAG}.jar"

          RELEASE_JSON="$(gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f "name=${RELEASE_TAG}" \
            -f "body=$(cat release-notes.md)" \
            -F draft=false \
            --jq '{tag_name, draft, assets: [.assets[] | select(.name | ascii_downcase | endswith(".jar")) | .name]}')"
          ACTUAL_TAG="$(printf '%s' "$RELEASE_JSON" | jq -r .tag_name)"
          DRAFT_STATUS="$(printf '%s' "$RELEASE_JSON" | jq -r .draft)"
          JAR_ASSETS="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets | sort | join(",")')"
          if [ "$ACTUAL_TAG" != "$RELEASE_TAG" ]; then
            echo "ERROR: GitHub returned tag '$ACTUAL_TAG' instead of '$RELEASE_TAG'."
            exit 1
          fi
          if [ "$DRAFT_STATUS" != "false" ]; then
            echo "ERROR: GitHub release '$RELEASE_TAG' was not published publicly."
            exit 1
          fi
          if [ "$JAR_ASSETS" != "ThJumpPads-${RELEASE_TAG}.jar" ]; then
            echo "ERROR: Expected exactly one plugin JAR, 'ThJumpPads-${RELEASE_TAG}.jar'; found: '${JAR_ASSETS}'."
            exit 1
          fi
