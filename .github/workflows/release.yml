name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: legacy
            java: "8"
            artifact_file: ThJumpPads-legacy
          - profile: legacy
            java: "11"
            artifact_file: ThJumpPads-legacy
          - profile: modern
            java: "8"
            artifact_file: ThJumpPads
          - profile: modern
            java: "11"
            artifact_file: ThJumpPads
          - profile: modern
            java: "16"
            artifact_file: ThJumpPads
          - profile: modern
            java: "17"
            artifact_file: ThJumpPads
          - profile: modern
            java: "21"
            artifact_file: ThJumpPads
          - profile: modern
            java: "25"
            artifact_file: ThJumpPads
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Determine build version
        id: project
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
              echo "Invalid release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            project_version="${BASH_REMATCH[1]}"
          else
            project_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          fi
          if [[ ! "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid project version: $project_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$project_version" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.profile }} JAR
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
          PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          mvn --batch-mode --no-transfer-progress \
            -P"${PROFILE}" \
            -Drevision="${PROJECT_VERSION}" \
            -Djava.target=8 \
            -Dmaven.compiler.source=1.8 \
            -Dmaven.compiler.target=1.8 \
            clean package

      - name: Verify JAR
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
          ARTIFACT_FILE: ${{ matrix.artifact_file }}
        shell: bash
        run: |
          jar_path="target/${ARTIFACT_FILE}-${PROJECT_VERSION}.jar"
          python3 - "$jar_path" "$PROJECT_VERSION" <<'PY'
          import sys
          import zipfile

          jar_path, project_version = sys.argv[1:]
          with zipfile.ZipFile(jar_path) as jar:
              descriptor = jar.read("plugin.yml").decode("utf-8").splitlines()
              class_file = jar.read("testudio/JumpPads/JumpPadsPlugin.class")
              entries = set(jar.namelist())

          if f"version: '{project_version}'" not in descriptor:
              raise SystemExit("plugin.yml version does not match the project version")
          if int.from_bytes(class_file[6:8], "big") != 52:
              raise SystemExit("JAR is not compatible with Java 8 bytecode")
          if any(name.startswith(("org/sqlite/", "com/mysql/", "com/google/protobuf/")) for name in entries):
              raise SystemExit("A JDBC library was unexpectedly packaged in the plugin JAR")
          print(f"Verified {jar_path}: version {project_version}, Java 8 bytecode, no JDBC drivers")
          PY

      - name: Upload ${{ matrix.profile }} JAR
        if: matrix.java == '8'
        uses: actions/upload-artifact@v4
        with:
          name: ThJumpPads-${{ matrix.profile }}-${{ steps.project.outputs.version }}
          path: target/${{ matrix.artifact_file }}-${{ steps.project.outputs.version }}.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi
          printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Download legacy JAR
        uses: actions/download-artifact@v4
        with:
          name: ThJumpPads-legacy-${{ steps.tag.outputs.version }}
          path: release-files

      - name: Download modern JAR
        uses: actions/download-artifact@v4
        with:
          name: ThJumpPads-modern-${{ steps.tag.outputs.version }}
          path: release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        shell: bash
        run: |
          legacy_jar="release-files/ThJumpPads-legacy-${RELEASE_VERSION}.jar"
          modern_jar="release-files/ThJumpPads-${RELEASE_VERSION}.jar"
          test -f "$legacy_jar"
          test -f "$modern_jar"
          gh release create "$TAG_NAME" "$legacy_jar" "$modern_jar" \
            --verify-tag \
            --title "ThJumpPads ${RELEASE_VERSION}" \
            --generate-notes
