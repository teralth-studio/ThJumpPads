name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Verify tag matches project version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version ($tag_version) does not match pom.xml ($project_version)." >&2
            exit 1
          fi

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "target/ThJumpPads-${GITHUB_REF_NAME#v}.jar" --verify-tag --title "ThJumpPads ${GITHUB_REF_NAME#v}" --generate-notes
