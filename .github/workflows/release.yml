name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Read project version
        id: project
        run: echo "version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="${{ steps.project.outputs.version }}"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version ($tag_version) does not match pom.xml ($project_version)." >&2
            exit 1
          fi

      - name: Build plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThJumpPads-${{ steps.project.outputs.version }}
          path: target/ThJumpPads-${{ steps.project.outputs.version }}.jar
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "target/ThJumpPads-${{ steps.project.outputs.version }}.jar" --verify-tag --title "ThJumpPads ${{ steps.project.outputs.version }}" --generate-notes
