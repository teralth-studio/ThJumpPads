name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Determine build version
        id: project
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
              echo "Invalid release tag: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            project_version="${BASH_REMATCH[1]}"
          else
            project_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          fi
          if [[ ! "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid project version: $project_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$project_version" >> "$GITHUB_OUTPUT"

      - name: Build legacy JAR
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Legacy build attempt ${attempt}/3"
            if mvn --batch-mode --no-transfer-progress -U \
              -Dmaven.wagon.http.retryHandler.count=3 \
              -Plegacy \
              -Drevision="${PROJECT_VERSION}" \
              -Djava.target=8 \
              -Dmaven.compiler.source=1.8 \
              -Dmaven.compiler.target=1.8 \
              clean package; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Legacy build failed after three attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
          legacy_jar="target/ThJumpPads-legacy-${PROJECT_VERSION}.jar"
          test -f "$legacy_jar"
          mkdir -p release-files
          cp "$legacy_jar" release-files/

      - name: Build modern JAR
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Modern build attempt ${attempt}/3"
            if mvn --batch-mode --no-transfer-progress -U \
              -Dmaven.wagon.http.retryHandler.count=3 \
              -Pmodern \
              -Drevision="${PROJECT_VERSION}" \
              -Djava.target=8 \
              -Dmaven.compiler.source=1.8 \
              -Dmaven.compiler.target=1.8 \
              clean package; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Modern build failed after three attempts." >&2
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
          modern_jar="target/ThJumpPads-${PROJECT_VERSION}.jar"
          test -f "$modern_jar"
          cp "$modern_jar" release-files/

      - name: Verify both JARs
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
        shell: bash
        run: |
          python3 - "$PROJECT_VERSION" <<'PY'
          import sys
          import zipfile

          project_version = sys.argv[1]
          artifacts = (
              f"release-files/ThJumpPads-legacy-{project_version}.jar",
              f"release-files/ThJumpPads-{project_version}.jar",
          )
          for jar_path in artifacts:
              with zipfile.ZipFile(jar_path) as jar:
                  descriptor = jar.read("plugin.yml").decode("utf-8").splitlines()
                  class_file = jar.read("testudio/JumpPads/JumpPadsPlugin.class")
                  entries = set(jar.namelist())

              if f"version: '{project_version}'" not in descriptor:
                  raise SystemExit(f"{jar_path}: plugin.yml version does not match the project version")
              if int.from_bytes(class_file[6:8], "big") != 52:
                  raise SystemExit(f"{jar_path}: expected Java 8 bytecode")
              if any(name.startswith(("org/sqlite/", "com/mysql/", "com/google/protobuf/")) for name in entries):
                  raise SystemExit(f"{jar_path}: a JDBC library was unexpectedly packaged")
              print(f"Verified {jar_path}")
          PY

      - name: Upload both JARs
        uses: actions/upload-artifact@v4
        with:
          name: ThJumpPads-release-${{ steps.project.outputs.version }}
          path: release-files/*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        id: tag
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi
          printf 'version=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Download both JARs
        uses: actions/download-artifact@v4
        with:
          name: ThJumpPads-release-${{ steps.tag.outputs.version }}
          path: release-files

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        shell: bash
        run: |
          legacy_jar="release-files/ThJumpPads-legacy-${RELEASE_VERSION}.jar"
          modern_jar="release-files/ThJumpPads-${RELEASE_VERSION}.jar"
          test -f "$legacy_jar"
          test -f "$modern_jar"
          gh release create "$TAG_NAME" "$legacy_jar" "$modern_jar" \
            --verify-tag \
            --title "ThJumpPads ${RELEASE_VERSION}" \
            --generate-notes
